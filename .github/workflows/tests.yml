name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s server/tests -v
      - run: python setup.py --plan
      - name: Validate macOS launcher
        if: runner.os == 'macOS'
        run: bash -n setup.command
      - name: Parse PowerShell launcher
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $parseErrors = $null
          $tokens = $null
          foreach ($script in @('windows.ps1','setup.ps1')) {
            [System.Management.Automation.Language.Parser]::ParseFile("$pwd/$script", [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) { $parseErrors | Format-List; exit 1 }
          }
          & ./setup.ps1 --plan --context 8192
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
