name: Windows Vulkan build
on: workflow_dispatch
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          choco install vulkan-sdk --yes --no-progress --limit-output
          if ($LASTEXITCODE -notin @(0, 1641, 3010)) { exit $LASTEXITCODE }
          $sdk = Get-ChildItem C:\VulkanSDK -Directory | Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
          if (-not $sdk) { throw 'Vulkan SDK not found' }
          "VULKAN_SDK=$($sdk.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$($sdk.FullName)\Bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - run: python server/bootstrap.py build
      - uses: actions/upload-artifact@v4
        with:
          name: windows-vulkan
          path: llama.cpp/build-vulkan/bin/Release/*
          if-no-files-found: error
